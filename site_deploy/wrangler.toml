# espadna.com: studio home + landing pages (build/espadna, from site/).
#   tool/build_web.sh --deploy
name = "espadna-site"
compatibility_date = "2025-09-01"
routes = [
  { pattern = "espadna.com", custom_domain = true },
  { pattern = "www.espadna.com", custom_domain = true },
]

[assets]
directory = "../build/espadna"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
