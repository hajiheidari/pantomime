<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espadna | بازی‌ها و اپ‌ها</title>
  <meta name="description" content="Espadna: بازی‌ها و اپ‌های سرگرم‌کننده برای دورهمی و خانواده، فارسی و انگلیسی.">
  <meta name="theme-color" content="#1A0F3D">
  <link rel="canonical" href="https://espadna.com/">
  <link rel="alternate" hreflang="fa" href="https://espadna.com/">
  <link rel="alternate" hreflang="en" href="https://espadna.com/en/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Espadna">
  <meta property="og:title" content="Espadna | بازی‌ها و اپ‌ها">
  <meta property="og:description" content="Espadna: بازی‌ها و اپ‌های سرگرم‌کننده برای دورهمی و خانواده، فارسی و انگلیسی.">
  <meta property="og:url" content="https://espadna.com/">
  <meta property="og:image" content="https://espadna.com/pantomime-app/og.png">
  <style>
    @font-face { font-family: Vazirmatn; font-weight: 700 900; font-display: swap; src: url(/Vazirmatn-Bold.ttf) format("truetype"); }
    :root { --bg: #1A0F3D; --card: #FFF7E6; --ink: #120A2B; --yellow: #FFD23F; --green: #3DDC84; --muted: #C9BFF2; }
    * { box-sizing: border-box; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; color: #fff; line-height: 1.8; font-family: Vazirmatn, Tahoma, sans-serif;
      background: var(--bg) radial-gradient(ellipse 120% 700px at 50% 0%, #5A36C9 0, #2A1B5C 50%, var(--bg) 100%) no-repeat; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    .lang { text-align: end; }
    .lang a { color: var(--muted); font-weight: 800; text-decoration: none; border: 2px solid rgba(255,255,255,.2); border-radius: 999px; padding: 2px 14px; }
    header { text-align: center; padding: 32px 0 8px; }
    .logo { font-size: clamp(48px, 13vw, 76px); font-weight: 900; color: var(--yellow); letter-spacing: 1px; text-shadow: 0 5px 0 var(--ink); line-height: 1.2; }
    .tag { color: var(--muted); font-size: 20px; font-weight: 700; margin: 6px 0 0; }
    h2 { color: var(--yellow); font-size: 26px; margin: 44px 0 14px; }
    .app { display: flex; gap: 18px; align-items: center; background: var(--card); color: var(--ink); border: 3px solid var(--ink); border-radius: 26px; padding: 18px; box-shadow: 0 7px 0 var(--ink); }
    .app img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
    .app h3 { margin: 0; font-size: 24px; }
    .app p { margin: 4px 0 12px; font-weight: 700; opacity: .8; }
    .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .btns a { text-decoration: none; font-weight: 900; color: var(--ink); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 16px; box-shadow: 0 4px 0 var(--ink); }
    .btns .play { background: var(--green); } .btns .more { background: #fff; }
    .soon { text-align: center; color: var(--muted); margin-top: 28px; font-weight: 700; }
    footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 56px; }
    @media (max-width: 480px) { .app { flex-direction: column; text-align: center; } .btns { justify-content: center; } }
  </style>
</head>
<body>
<main>
  <nav class="lang"><a href="/en/" hreflang="en" lang="en">English</a></nav>
  <header>
    <div class="logo">Espadna</div>
    <p class="tag">بازی‌ها و اپ‌هایی برای دورهمی‌های شاد</p>
  </header>
  <h2>بازی‌ها و اپ‌های ما</h2>
  <article class="app">
    <img src="/pantomime-app/icon.png" alt="" width="96" height="96">
    <div>
      <h3>پانتومیم دورهمی</h3>
      <p>بازی ادا و حدس کلمه برای دورهمی‌ها؛ تیمی یا گوشی روی پیشونی.</p>
      <div class="btns">
        <a class="play" href="__GAME_URL__/?lang=fa">▶️ بازی آنلاین</a>
        <a class="more" href="/pantomime-app/">معرفی و دانلود</a>
      </div>
    </div>
  </article>
  <p class="soon">به‌زودی بازی‌های بیشتر…</p>
  <footer>© Espadna</footer>
</main>
</body>
</html>
