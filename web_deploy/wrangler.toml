# Static hosting of build/site (landing page + /play/ game) on Cloudflare
# Workers static assets (free, unlimited asset requests).
#   tool/build_web.sh --deploy
name = "pantomime"
compatibility_date = "2025-09-01"

[assets]
directory = "../build/site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
