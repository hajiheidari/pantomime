# The web game (build/game) on Cloudflare Workers static assets (free).
#   tool/build_web.sh --deploy
name = "pantomime"
compatibility_date = "2025-09-01"
# Keep the first address (pantomime.sepanta-hesaban.workers.dev) for old links.
workers_dev = true
routes = [{ pattern = "pantomime.espadna.com", custom_domain = true }]

[assets]
directory = "../build/game"
not_found_handling = "single-page-application"
